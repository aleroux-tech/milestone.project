<!doctype html>
<html lang="en">
  <head>
    <title>About Me</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <header>
      <h1>About Me and Contacts</h1>

      <img
        src="assets/images/chatgptfortnitefam.png"
        alt="A family gaming scene"
        class="hero-image"
        loading="eager"
        decoding="async"
      />
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects/Work</a>
      <a href="about.html">About/Contact</a>
    </nav>

    <main>
      <button id="toggleForm">Show/Hide Contact Form</button>

      <form id="contact-form">
        <fieldset>
          <legend>Send a message</legend>
          <p id="form-instructions">All fields are required.</p>

          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            aria-required="true"
            aria-describedby="form-error"
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-required="true"
            aria-describedby="form-error"
          />

          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            required
            aria-required="true"
            aria-describedby="form-error"
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            required
            aria-required="true"
            aria-describedby="form-error"
          ></textarea>

          <p id="form-error" role="alert" aria-live="polite">
            Please complete every required field before sending.
          </p>

          <button type="submit">Send</button>
        </fieldset>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 Families That Game Together</p>
    </footer>
    <script src="assets/script.js"></script>
  </body>
</html>
