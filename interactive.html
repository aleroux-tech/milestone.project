<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive DOM Homework</title>

    <!-- Correct CSS path -->
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <h1>Interactive DOM Homework</h1>

    <h2>1. Button Changes Content</h2>
    <button id="factButton">Show Beach Fact</button>
    <p id="beachFact">Click the button to see a fact!</p>

    <h2>2. Style Changes on Input</h2>
    <input id="colorInput" type="text" placeholder="Type a color" />
    <p id="colorPreview">This text changes color as you type.</p>

    <h2>3. Dynamic List</h2>
    <input id="listInput" type="text" placeholder="Add a beach item" />
    <button id="addItem">Add Item</button>
    <ul id="itemList"></ul>

    <!-- Correct JS path -->
    <script src="assets/script.js"></script>
  </body>
</html>
